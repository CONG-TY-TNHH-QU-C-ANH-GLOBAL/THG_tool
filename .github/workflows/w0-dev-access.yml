            out.manifest.projection = {...project(m,['schema','bundleVersion','contentDigest','coreContract']),identity:project(m.identity,['coreVersion','coreImageDigest','sdkVersion','contractCatalogVersion','bundleDigest']),catalog:project(m.catalog,['path','sha256']),skills:[]};
            if(!Array.isArray(m.skills) || m.skills.length>200) {out.manifest.status='SCHEMA_UNKNOWN';return;}
            const ids = new Set();
            for(const s of m.skills) if(s && /^[a-z][a-z0-9-]{0,39}$/.test(s.id) && !ids.has(s.id)) { ids.add(s.id); out.manifest.projection.skills.push(project(s,['id','version','treeSha256'])); }
            if(!m.catalog || !safe(m.catalog.path) || !m.catalog.path.startsWith('catalog/') || !m.catalog.path.endsWith('.json')) {out.catalog={status:'UNSAFE_PATH'};return;}
            const cr=read(m.catalog.path,4194304);
            out.catalog={path:m.catalog.path,...project(cr,['status','bytes','sha256'])};
            if(cr.status!=='READ') return;
            let c;try {c=JSON.parse(cr.text);}catch{out.catalog.status='PARSE_ERROR';return;}
            if(!c || c.schema!=='core-dev.capability-catalog@1' || !Array.isArray(c.capabilities) || !Array.isArray(c.capabilityDefs) || c.capabilities.length>1000 || c.capabilityDefs.length>5000){out.catalog.status='SCHEMA_UNKNOWN';return;}
