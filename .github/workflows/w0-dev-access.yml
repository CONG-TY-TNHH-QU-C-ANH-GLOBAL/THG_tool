            if(!out.truncated && out.files.every(f=>f.status==='READ'))out.status='READ';
          }
          try { collect(); } catch { out.status='READ_ERROR'; }
          process.stdout.write(JSON.stringify(out));
          '''

          def public_bundle_docs(memory, scoped_erp):
              if memory < 128 * 1024 * 1024:
                  return {'schema': 'w0.public-bundle-docs@1', 'status': 'SKIPPED_LOW_MEMORY'}
              if len(scoped_erp) != 1 or not isinstance(scoped_erp[0], str) or not re.fullmatch(r'[a-f0-9]{64}', scoped_erp[0]):
                  return {'schema': 'w0.public-bundle-docs@1', 'status': 'UNAVAILABLE'}
              cid = scoped_erp[0]
              identity = command(['docker', 'inspect', '--type', 'container', '--format',
                                  '{{.Id}}|{{.State.Running}}|{{index .Config.Labels "com.docker.compose.project.working_dir"}}|{{index .Config.Labels "com.docker.compose.service"}}', cid])
              if identity != cid + '|true|/opt/thg-newhub|erp\n':
