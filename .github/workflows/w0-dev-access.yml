              expected = cid + '|true|/opt/thg-newhub|erp|' + core + '\n'
              if not tools['docker'] or public_bundle_identity(cid) != expected:
                  return out
              try:
                  state, raw = official_metadata_command(['docker','image','ls','registry.autonow.vn/core/dev-bundle','--digests','--no-trunc','--format','{{.Digest}}|{{.ID}}'])
                  out['cache']['status'] = state
                  if state == 'OK':
                      images = set()
                      for line in raw.decode('utf-8','strict').splitlines():
                          if re.fullmatch(r'sha256:[a-f0-9]{64}\|sha256:[a-f0-9]{64}',line):
                              images.add(tuple(line.split('|')))
                          elif not re.fullmatch(r'<none>\|sha256:[a-f0-9]{64}',line):
                              raise ValueError('cache shape')
                      if len(images) > 8:
                          raise ValueError('cache cap')
                      out['cache']['images'] = [dict(digest=d,imageId=i) for d,i in sorted(images)]
                  else:
                      out['status'] = state
                      return out
                  state, raw = official_metadata_command(['docker','manifest','inspect','registry.autonow.vn/core/erp@' + core])
                  out['manifest']['status'] = state
                  if state == 'OK':
                      out['manifest']['projection'] = official_manifest_projection(public_bundle_json(raw.decode('utf-8','strict')))
                  out['status'] = 'METADATA_ONLY' if state == 'OK' else state
              except (ValueError, UnicodeError, RecursionError, MemoryError):
