                      out['manifest']['typeObservation'] = mr['typeObservation']
                  missing_manifest = mr['status'] == 'MISSING'
                  if mr['status'] != 'READ' and not missing_manifest:
                      return
                  m, ids, skills = None, set(), []
                  if missing_manifest:
                      # Exact public file already observed in actual09; no inventory/release verification.
                      cp = 'catalog/core-capabilities.json'
                  else:
                      try:
                          m = public_bundle_json(mr['text'])
                      except (ValueError, RecursionError):
                          out['manifest']['status'] = 'PARSE_ERROR'
                          return
                      if type(m) is not dict or m.get('schema') != 'core-dev.bundle-manifest@1' or type(m.get('skills')) is not list or len(m['skills']) > 200:
                          out['manifest']['status'] = 'SCHEMA_UNKNOWN'
                          return
                      for s in m['skills']:
                          if type(s) is not dict or type(s.get('id')) is not str or not re.fullmatch(r'[a-z][a-z0-9-]{0,39}', s['id']) or s['id'] in ids:
                              out['manifest']['status'] = 'SCHEMA_UNKNOWN'
                              return
                          ids.add(s['id'])
                          skills.append(project(s,['id','version','treeSha256']))
                      out['manifest']['projection'] = dict(project(m,['schema','bundleVersion','contentDigest','coreContract']),identity=project(m.get('identity'),['coreVersion','coreImageDigest','sdkVersion','contractCatalogVersion','bundleDigest']),catalog=project(m.get('catalog'),['path','sha256']),skills=skills)
                      cp = m.get('catalog',{}).get('path') if type(m.get('catalog')) is dict else None
                  if not public_bundle_safe_path(cp) or not cp.startswith('catalog/') or not cp.endswith('.json'):
                      out['catalog'] = {'status':'UNSAFE_PATH'}
                      return
                  cr = read_public_bundle_file(cid, cp, 4194304)
                  out['catalog'] = dict(path=cp, **project(cr,['status','bytes','sha256']))
                  if cr['status'] == 'NOT_REGULAR' and 'typeObservation' in cr:
                      out['catalog']['typeObservation'] = cr['typeObservation']
                  if cr['status'] != 'READ':
                      return
