                          if re.search(r'[:#?%\\]',ref):
                              continue
                          ref = posixpath.normpath(posixpath.join(posixpath.dirname(p),ref))
                          if not public_bundle_safe_path(ref) or not ref.startswith(('skills/','docs/')) or not ref.endswith(('.md','.yaml','.json')) or ref.endswith(('SKILL.md','manifest.yaml')) or ref in refs:
                              continue
                          refs.add(ref)
                          if len(refs) > 3:
                              out['truncated'] = True
                              continue
                          document(ref,'REFERENCE',p)
                  if not missing_manifest and not out['truncated'] and all(f['status'] == 'READ' for f in out['files']):
                      out['status'] = 'READ'
              try:
                  collect()
              except (OSError, ValueError, TypeError, KeyError, RecursionError):
                  out['status'] = 'READ_ERROR'
              return out

          def official_metadata_command(argv):
              # Host CLI only, outside RLIMIT_AS. Bounded pipes, absolute deadline, owned cleanup.
              import selectors
              proc, selector = None, selectors.DefaultSelector()
              output, error = bytearray(), bytearray()
              try:
                  proc = subprocess.Popen(argv, stdout=subprocess.PIPE, stderr=subprocess.PIPE, stdin=subprocess.DEVNULL)
                  selector.register(proc.stdout, selectors.EVENT_READ, 'out')
                  selector.register(proc.stderr, selectors.EVENT_READ, 'err')
                  deadline = time.monotonic() + 8
                  while selector.get_map():
                      remaining = deadline - time.monotonic()
                      if remaining <= 0:
                          return 'TIMEOUT', b''
                      for key, unused in selector.select(remaining):
                          block = os.read(key.fileobj.fileno(), 16384)
                          if not block:
                              selector.unregister(key.fileobj)
                              continue
                          target, cap = (output, 262144) if key.data == 'out' else (error, 4096)
                          if len(target) + len(block) > cap:
                              return 'OUTPUT_LIMIT', b''
                          target.extend(block)
                  try:
                      code = proc.wait(timeout=max(0.001, deadline - time.monotonic()))
                  except subprocess.TimeoutExpired:
                      return 'TIMEOUT', b''
                  if code == 0:
                      return 'OK', bytes(output)
                  text = bytes(error).lower()
                  kind = ('AUTH_DENIED' if any(s in text for s in (b'unauthorized', b'denied', b'authentication required', b'forbidden')) else
                          'NOT_FOUND' if any(s in text for s in (b'no such manifest', b'manifest unknown', b'not found')) else
                          'NETWORK_ERROR' if any(s in text for s in (b'timeout', b'connection refused', b'no such host', b'network is unreachable')) else 'EXIT_ERROR')
                  return kind, b''
              except OSError:
                  return 'UNAVAILABLE', b''
              finally:
                  selector.close()
                  if proc is not None:
                      if proc.poll() is None:
                          proc.kill()
                      proc.wait()
                      for stream in (proc.stdout, proc.stderr):
                          if stream is not None:
                              stream.close()

          def official_manifest_projection(body, descriptor_limit=16):
              if descriptor_limit not in (16,64):
                  raise ValueError('descriptor cap')
              digest = r'sha256:[a-f0-9]{64}'
              core = 'sha256:0e49465e84015a35ea2353ad6501e324a458d5049105802077886e2c86414dcb'
              ref = r'(?:oci://)?registry\.autonow\.vn/core/dev-bundle@sha256:[a-f0-9]{64}'
              def media(value):
                  return type(value) is str and len(value) <= 120 and re.fullmatch(r'[A-Za-z0-9.+-]+/[A-Za-z0-9.+-]+',value)
              if type(body) is not dict or type(body.get('schemaVersion')) is not int or body['schemaVersion'] != 2:
                  raise ValueError('manifest schema')
              out = dict(schemaVersion=2, descriptors=[], annotationKeys=[], devBundleRefs=[], releaseTuples=[])
              if 'mediaType' in body:
                  if not media(body['mediaType']):
                      raise ValueError('media')
                  out['mediaType'] = body['mediaType']
              descriptors = []
              for key in ('manifests','layers'):
                  if key in body:
                      if type(body[key]) is not list:
                          raise ValueError('descriptors')
                      descriptors.extend(body[key])
              if 'config' in body:
                  descriptors.append(body['config'])
              if len(descriptors) > descriptor_limit:
                  raise ValueError('descriptor cap')
              for d in descriptors:
                  if (type(d) is not dict or not media(d.get('mediaType')) or type(d.get('digest')) is not str
                          or not re.fullmatch(digest,d['digest']) or type(d.get('size')) is not int or not 0 <= d['size'] <= 2**63-1):
                      raise ValueError('descriptor')
                  out['descriptors'].append({k:d[k] for k in ('mediaType','digest','size')})
              annotations = body.get('annotations',{})
              if type(annotations) is not dict or len(annotations) > 16:
                  raise ValueError('annotations')
              for key,value in sorted(annotations.items()):
                  if type(key) is not str or not re.fullmatch(r'[A-Za-z0-9._:/-]{1,120}',key):
                      raise ValueError('annotation key')
                  out['annotationKeys'].append(key)
                  if type(value) is not str:
                      raise ValueError('annotation value')
                  if re.fullmatch(ref,value):
                      out['devBundleRefs'].append(value if value.startswith('oci://') else 'oci://' + value)
                  elif value.startswith('{') and len(value) <= 4096:
                      try:
                          t = public_bundle_json(value)
                      except (ValueError, RecursionError):
                          continue
                      fields = {'schema','coreVersion','coreImageDigest','devBundleVersion','devBundleSource','devBundleDigest','contentDigest','sdkVersion'}
                      if (type(t) is dict and set(t) == fields and t['schema'] == 'erp-core.release-tuple@1'
                              and t['coreImageDigest'] == core and all(type(v) is str and len(v) <= 240 for v in t.values())
                              and all(re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+',t[k]) for k in ('coreVersion','devBundleVersion'))
                              and re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?',t['sdkVersion'])
                              and re.fullmatch('oci://' + ref.removeprefix('(?:oci://)?'),t['devBundleSource'])
                              and all(re.fullmatch(digest,t[k]) for k in ('devBundleDigest','contentDigest'))):
                          out['releaseTuples'].append(t)
              out['devBundleRefs'] = sorted(set(out['devBundleRefs']))
              return out

          def official_bundle_metadata(memory, scoped_erp):
