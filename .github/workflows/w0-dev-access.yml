                  allowed = ['/opt/thg-newhub'] if location == 'HOST' else roots
                  require(any(path.startswith(root + '/') for root in allowed))
              c = value['coverage']
              require(type(c) is dict and set(c) == {'hostRoot', 'containerRoots', 'maxDepth', 'maxCandidates', 'maxBodyBytes', 'entriesVisited', 'truncated', 'schemaFields', 'exclusions'})
              require(c['hostRoot'] == '/opt/thg-newhub' and c['containerRoots'] in ([], roots))
