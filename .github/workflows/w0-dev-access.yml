                  for v in item.values():
                      token(v,r'sha256:[a-f0-9]{64}',71)
              require(len({(i['digest'],i['imageId']) for i in c['images']}) == len(c['images']))
              require(type(m) is dict and set(m) <= {'status','projection'} and m.get('status') in states)
              require(('projection' in m) == (m['status'] == 'OK'))
              require(value['status'] != 'METADATA_ONLY' or m['status'] == 'OK')
              if 'projection' not in m:
                  return value
              p = m['projection']
              require(type(p) is dict and {'schemaVersion','descriptors','annotationKeys','devBundleRefs','releaseTuples'} <= set(p) <= {'schemaVersion','mediaType','descriptors','annotationKeys','devBundleRefs','releaseTuples'})
              require(type(p['schemaVersion']) is int and p['schemaVersion'] == 2)
              if 'mediaType' in p:
                  token(p['mediaType'],r'[A-Za-z0-9.+-]+/[A-Za-z0-9.+-]+',120)
              require(type(p['descriptors']) is list and len(p['descriptors']) <= descriptor_limit)
              for d in p['descriptors']:
                  require(type(d) is dict and set(d) == {'mediaType','digest','size'})
                  token(d['mediaType'],r'[A-Za-z0-9.+-]+/[A-Za-z0-9.+-]+',120)
                  token(d['digest'],r'sha256:[a-f0-9]{64}',71)
                  require(type(d['size']) is int and 0 <= d['size'] <= 2**63-1)
              for key in ('annotationKeys','devBundleRefs','releaseTuples'):
                  require(type(p[key]) is list and len(p[key]) <= 16)
              require(len(set(p['annotationKeys'])) == len(p['annotationKeys']))
              for key in p['annotationKeys']:
                  token(key,r'[A-Za-z0-9._:/-]{1,120}',120)
              require(p['devBundleRefs'] == sorted(set(p['devBundleRefs'])))
              for ref in p['devBundleRefs']:
                  token(ref,r'oci://registry\.autonow\.vn/core/dev-bundle@sha256:[a-f0-9]{64}',140)
              for t in p['releaseTuples']:
                  require(type(t) is dict and set(t) == {'schema','coreVersion','coreImageDigest','devBundleVersion','devBundleSource','devBundleDigest','contentDigest','sdkVersion'})
                  require(t['schema'] == 'erp-core.release-tuple@1' and t['coreImageDigest'] == 'sha256:0e49465e84015a35ea2353ad6501e324a458d5049105802077886e2c86414dcb')
                  for key in ('coreVersion','devBundleVersion'):
                      token(t[key],r'[0-9]+\.[0-9]+\.[0-9]+',240)
                  token(t['sdkVersion'],r'[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?',240)
                  token(t['devBundleSource'],r'oci://registry\.autonow\.vn/core/dev-bundle@sha256:[a-f0-9]{64}',140)
                  for key in ('devBundleDigest','contentDigest'):
                      token(t[key],r'sha256:[a-f0-9]{64}',71)
              return value

          def validate_core_distribution_metadata(value):
              core = 'sha256:0e49465e84015a35ea2353ad6501e324a458d5049105802077886e2c86414dcb'
              references = [('sha256:c36e683f65c6075fce246bcb6471bd47213ac98493a19328dfdf66fcb01c9517',4861),
                            ('sha256:f3ca55ce4bb409e1b65ba5d10e0e789137bc59468957aa942e83adba9e248e0c',564)]
              require(type(value) is dict and len({'rootCoreDigest','coreImageDigest'} & set(value)) == 1)
              identity_key = 'coreImageDigest' if 'coreImageDigest' in value else 'rootCoreDigest'
              require(set(value) == {'schema','status',identity_key,'resourceCondition','labels','children'} | ({'parseObservation'} if 'parseObservation' in value else set()))
              require(value['schema'] == 'w0.core-distribution-metadata@1' and value[identity_key] == core)
              if 'parseObservation' in value:
                  o = value['parseObservation']
                  require(value['status'] == 'PARSE_ERROR' and type(o) is dict and {'stage','reason'} <= set(o) <= {'stage','reason','descriptorCount'})
                  require(o['stage'] in ('LABELS','CHILD1','CHILD2') and o['reason'] in ('MALFORMED_JSON','SCHEMA','DESCRIPTOR_COUNT','DESCRIPTOR_SHAPE','ANNOTATION','OTHER'))
                  if 'descriptorCount' in o:
                      require(o['reason'] == 'DESCRIPTOR_COUNT' and type(o['descriptorCount']) is int and 0 <= o['descriptorCount'] <= 65535)
              states = {'OK','AUTH_DENIED','NOT_FOUND','NETWORK_ERROR','EXIT_ERROR','TIMEOUT','OUTPUT_LIMIT','UNAVAILABLE','PARSE_ERROR'}
              require(value['status'] in (states - {'OK'}) | {'METADATA_ONLY'})
              require(value['resourceCondition'] in ('NORMAL','LOW_MEMORY','LOW_DISK'))
              def projected_record(record, keys):
                  require(type(record) is dict and set(record) == keys | ({'projection'} if 'projection' in record else set()))
                  require(record['status'] in states and (('projection' in record) == (record['status'] == 'OK')))
                  if 'projection' in record:
                      p = record['projection']
                      if keys == {'status'}:
                          require(type(p) is dict and set(p) == {'keys','devBundleRefs','releaseTuples'})
                          p = dict(schemaVersion=2,descriptors=[],annotationKeys=p['keys'],devBundleRefs=p['devBundleRefs'],releaseTuples=p['releaseTuples'])
                      # Internal validation adapter only: no fabricated OCI schema is emitted for labels.
                      validate_official_bundle_metadata(dict(schema='w0.official-dev-bundle-metadata@1',status='METADATA_ONLY',
                          tools=dict(docker=True,oras=False,cosign=False),resourceCondition='NORMAL',
                          cache=dict(status='UNAVAILABLE',images=[]),manifest=dict(status='OK',projection=p)),16 if keys == {'status'} else 64)
              projected_record(value['labels'],{'status'})
              require(type(value['children']) is list and len(value['children']) == 2)
              for child,(digest,size) in zip(value['children'],references):
                  projected_record(child,{'digest','declaredSize','status'})
                  require(child['digest'] == digest and type(child['declaredSize']) is int and child['declaredSize'] == size)
              if 'parseObservation' in value:
                  stage = value['parseObservation']['stage']
                  failed = value['labels'] if stage == 'LABELS' else value['children'][int(stage[-1])-1]
                  require(failed['status'] == 'PARSE_ERROR')
              if value['status'] == 'METADATA_ONLY':
                  require(value['labels']['status'] == 'OK' and all(c['status'] == 'OK' for c in value['children']))
              return value

          def validate_container_diagnostics(value):
              require(type(value) is dict and set(value) == {'observations'})
              items = value['observations']
              require(type(items) is list and 1 <= len(items) <= 2)
              for index, item in enumerate(items):
                  require(type(item) is dict and {'stage', 'state'} <= set(item) <= {'stage', 'state', 'exitCode', 'stdoutBytes', 'errorKind'})
                  require(item['stage'] == ('DOCKER_PS' if index == 0 else 'DOCKER_INSPECT'))
                  require(item['state'] in ('OK', 'EXIT_ERROR', 'TIMEOUT', 'OUTPUT_LIMIT', 'OS_ERROR', 'DECODE_ERROR'))
                  if 'exitCode' in item:
                      require(type(item['exitCode']) is int and 0 <= item['exitCode'] <= 255)
                  if 'stdoutBytes' in item:
                      require(type(item['stdoutBytes']) is int and 0 <= item['stdoutBytes'] <= 131073)
                  if 'errorKind' in item:
                      require(item['state'] == 'EXIT_ERROR' and item['errorKind'] in ('TEMPLATE_HEALTH_FIELD', 'TEMPLATE_ID_FIELD', 'TEMPLATE_OTHER', 'OBJECT_MISSING', 'DAEMON_UNAVAILABLE', 'PERMISSION_DENIED', 'OTHER'))
                  if item['state'] == 'OK':
                      require(item.get('exitCode') == 0 and 'stdoutBytes' in item)
                  if item['state'] == 'EXIT_ERROR':
                      require('exitCode' in item and 1 <= item['exitCode'] <= 255)
              return value

          try:
              with Path(sys.argv[1]).open('rb') as stream:
                  raw = stream.read(1572865)
              # 192 KiB public text can expand sixfold under JSON ensure_ascii.
              require(len(raw) <= 1572864)
              marker = 'W0_REMOTE_METADATA_JSON='
              records = [line[len(marker):] for line in raw.decode('utf-8').splitlines() if line.startswith(marker)]
              require(len(records) == 1)
              metadata = json.loads(records[0], object_pairs_hook=unique,
                                    parse_constant=lambda _: require(False))
              require(type(metadata) is dict)
              require({'schemaVersion', 'euid', 'targetDirectory', 'appDirectoryExists', 'os',
                       'memoryAvailableBytes', 'diskAvailableBytes', 'serverPublicFingerprint',
                        'paths', 'containerInspection', 'containers', 'health'} <= metadata.keys())
              require('publicDiscovery' in metadata)
              require('signedDiscovery' in metadata)
              require('containerDiagnostics' in metadata)
              diagnostics = validate_container_diagnostics(metadata['containerDiagnostics'])
              discovery = validate_public_discovery(metadata['publicDiscovery'])
              signed = validate_signed_discovery(metadata['signedDiscovery'])
              catalog = validate_catalog_probe(metadata['catalogProbe'])
              bundle_docs = validate_public_bundle_docs(metadata['publicBundleDocs'])
              official = validate_official_bundle_metadata(metadata['officialDevBundle']) if 'officialDevBundle' in metadata else None
              distribution = validate_core_distribution_metadata(metadata['coreDistribution']) if 'coreDistribution' in metadata else None
              if bundle_docs['status'] == 'SKIPPED_LOW_MEMORY':
                  require(type(metadata.get('memoryAvailableBytes')) is int and metadata['memoryAvailableBytes'] < 128 * 1024 * 1024)
              if catalog['status'] == 'SKIPPED_LOW_MEMORY':
                  require(type(metadata.get('memoryAvailableBytes')) is int and metadata['memoryAvailableBytes'] < 128 * 1024 * 1024)
              if signed['status'] == 'SKIPPED_LOW_MEMORY':
                  require(type(metadata.get('memoryAvailableBytes')) is int and metadata['memoryAvailableBytes'] < 128 * 1024 * 1024)
              if discovery['status'] == 'SKIPPED_LOW_MEMORY':
                  require(type(metadata.get('memoryAvailableBytes')) is int and metadata['memoryAvailableBytes'] < 128 * 1024 * 1024)
              require(type(metadata.get('schemaVersion')) is int and metadata['schemaVersion'] == 1)
              require(type(metadata.get('euid')) is int and metadata['euid'] == 0)
              require(metadata.get('targetDirectory') == '/opt/thg-newhub')
              require(metadata.get('appDirectoryExists') is True)
              clean = {'schemaVersion': 1, 'euid': 0, 'targetDirectory': '/opt/thg-newhub', 'appDirectoryExists': True}
              clean['publicDiscovery'] = discovery
              clean['signedDiscovery'] = signed
              clean['catalogProbe'] = catalog
              clean['publicBundleDocs'] = bundle_docs
              if official is not None:
                  clean['officialDevBundle'] = official
              if distribution is not None:
                  clean['coreDistribution'] = distribution
              clean['containerDiagnostics'] = diagnostics
              if 'os' in metadata:
                  require(type(metadata['os']) is dict)
                  require({'id', 'versionId'} <= metadata['os'].keys())
                  clean['os'] = {key: token(metadata['os'][key], r'[A-Za-z0-9._-]{1,64}', 64)
                                 for key in ('id', 'versionId') if key in metadata['os']}
              for key in ('memoryAvailableBytes', 'diskAvailableBytes'):
                  if key in metadata:
                      value = metadata[key]
                      require(type(value) is int and 0 <= value <= 2**63 - 1)
                      clean[key] = value
              if 'serverPublicFingerprint' in metadata:
                  value = token(metadata['serverPublicFingerprint'], r'SHA256:[A-Za-z0-9+/]{43}', 50)
                  require(value == os.environ['TRUSTED_HOST_FINGERPRINT'])
                  clean['serverPublicFingerprint'] = value
              if 'paths' in metadata:
                  require(type(metadata['paths']) is dict)
                  require({'upgradeScript', 'backupScript', 'internalCosignPublicKey',
                           'packageJson', 'srcDirectory'} <= metadata['paths'].keys())
                  clean['paths'] = {}
                  for key in ('upgradeScript', 'backupScript', 'internalCosignPublicKey', 'packageJson', 'srcDirectory'):
                      if key in metadata['paths']:
                          require(type(metadata['paths'][key]) is bool)
                          clean['paths'][key] = metadata['paths'][key]
              if 'containerInspection' in metadata:
                  require(metadata['containerInspection'] in ('COMPLETE', 'UNAVAILABLE'))
                  clean['containerInspection'] = metadata['containerInspection']
              require(type(metadata.get('containers')) is list and len(metadata['containers']) <= 32)
              clean['containers'] = []
              for item in metadata['containers']:
                  require(type(item) is dict)
                  container = {
                      'name': token(item.get('name'), r'[A-Za-z0-9][A-Za-z0-9_.-]*'),
                      'image': token(item.get('image'), r'[A-Za-z0-9][A-Za-z0-9._/@:+-]*'),
                      'imageId': token(item.get('imageId'), r'sha256:[a-f0-9]{64}'),
                  }
                  require(item.get('status') in ('created', 'restarting', 'running', 'removing', 'paused', 'exited', 'dead'))
                  container['status'] = item['status']
                  if 'health' in item:
                      require(item['health'] in (None, 'starting', 'healthy', 'unhealthy', 'none'))
                      container['health'] = item['health']
                  if 'service' in item:
                      container['service'] = token(item['service'], r'[A-Za-z0-9][A-Za-z0-9_.-]*', 128)
                  if 'version' in item:
                      container['version'] = token(item['version'], r'v?[0-9]+\.[0-9]+\.[0-9]+(?:[-+][A-Za-z0-9.-]+)?', 80)
                  if 'revision' in item:
                      container['revision'] = token(item['revision'], r'[a-fA-F0-9]{7,64}', 64)
                  clean['containers'].append(container)
              require(type(metadata.get('health')) is dict)
              health = metadata['health']
              require('httpStatus' in health)
              status = health.get('httpStatus')
              require(status is None or (type(status) is int and 100 <= status <= 599))
              clean['health'] = {'httpStatus': status}
              if 'version' in health:
                  clean['health']['version'] = token(health['version'], r'v?[0-9]+\.[0-9]+\.[0-9]+(?:[-+][A-Za-z0-9.-]+)?', 80)
              if 'deploymentMode' in health:
                  require(health['deploymentMode'] in ('PRODUCTION', 'NON_PRODUCTION'))
                  clean['health']['deploymentMode'] = health['deploymentMode']
              print('host_identity=PINNED_USER_TOFU')
              print(marker + json.dumps(clean, separators=(',', ':'), sort_keys=True))
          except Exception:
              raise SystemExit('Remote metadata rejected.')
          W0_VALIDATE_PY
          then
            fail 'Read-only metadata validation failed.'
          fi
