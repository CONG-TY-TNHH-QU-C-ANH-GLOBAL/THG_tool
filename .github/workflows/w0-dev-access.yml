                  out['truncated'] = len(related) > 3
                  known = {'task.assign@5','task.edit@2','task.get@2','task.policy.set@2','task.fields.set@3','task.forms.set@3','task.automation.rules.set@3'}
                  seen = set()
                  for d in c['capabilityDefs']:
                      if type(d) is not dict or type(d.get('name')) is not str:
                          continue
                      name = d['name']
