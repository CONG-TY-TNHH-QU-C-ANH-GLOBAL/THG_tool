                  if digest is not None and (type(digest) is not str or not re.fullmatch(r'[a-f0-9]{64}',digest) or digest != cr['sha256']):
                      out['catalog']['status'] = 'CHANGED'
                      return
                  try:
                      c = public_bundle_json(cr['text'])
                  except (ValueError, RecursionError):
                      out['catalog']['status'] = 'PARSE_ERROR'
                      return
                  if (type(c) is not dict or c.get('schema') != 'core-dev.capability-catalog@1'
                          or type(c.get('capabilities')) is not list or len(c['capabilities']) > 1000
                          or type(c.get('capabilityDefs')) is not list or len(c['capabilityDefs']) > 5000):
