                  if len(fields) >= 2 and re.fullmatch(r'SHA256:[A-Za-z0-9+/]{43}', fields[1]):
                      metadata['serverPublicFingerprint'] = fields[1]

              containers = []
              scoped_erp = []
              metadata['containerInspection'] = 'UNAVAILABLE'
              ids_text = command(['docker', 'ps', '--all', '--filter',
                                  'label=com.docker.compose.project.working_dir=/opt/thg-newhub',
                                  '--format', '{{.ID}}'], stage='DOCKER_PS')
              if ids_text is not None:
                  ids = ids_text.splitlines()
                  if len(ids) > 32 or any(not re.fullmatch(r'[a-f0-9]{12,64}', item) for item in ids):
                      raise ValueError('container list')
