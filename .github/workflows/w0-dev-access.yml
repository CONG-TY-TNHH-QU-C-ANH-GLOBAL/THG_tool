            const addresses = JSON.parse(process.argv[2]);
            if (!Array.isArray(addresses) || !addresses.length || addresses.length > 16 || addresses.some(a => typeof a !== 'string')) throw new Error('SCOPE');
            finish(await signedRead({readPublicJson, lookup:dns.lookup,
              loadSdk:() => import('@erp-core/ext-sdk'), privateKey:process.env.EXT_SERVICE_KEY,
              baseUrl:process.env.ERP_CORE_URL ?? 'http://erp:3000', allowedAddresses:addresses}));
