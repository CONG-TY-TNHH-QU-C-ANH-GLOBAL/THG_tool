              out = dict(schema='w0.public-bundle-docs@1', status='PARTIAL', manifest=None, catalog=None,
                         taskSkillIds=[], files=[], capabilityDefs=[], otherNames=[],
                         limits=dict(perTextBytes=65536,totalTextBytes=196608,maxTaskSkills=3,maxRefs=3), textBytes=0,truncated=False)
              def project(value, keys):
