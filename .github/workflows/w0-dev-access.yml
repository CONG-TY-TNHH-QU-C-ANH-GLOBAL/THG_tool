name: W0 DEV admission and pinned read-only metadata

'on':
  push:
    branches: [work/w0-dev-access]

permissions: {}

jobs:
  admit:
    if: github.repository == 'CONG-TY-TNHH-QU-C-ANH-GLOBAL/THG_tool' && github.ref == 'refs/heads/work/w0-dev-access' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Compare configured target without disclosing secret values
        id: target_gate
        shell: bash
        env:
          TARGET_HOST_MATCH: ${{ secrets.SERVER_HOST == '103.216.117.194' }}
          TARGET_PORT_MATCH: ${{ secrets.SERVER_PORT == '24700' }}
          TARGET_USER_MATCH: ${{ secrets.SERVER_USER == 'root' }}
          SSH_KEY_PRESENT: ${{ secrets.SERVER_SSH_KEY != '' }}
          CONFIGURED_SSH_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          if [[ "${TARGET_HOST_MATCH:-}" != 'true' ||
                "${TARGET_PORT_MATCH:-}" != 'true' ||
                "${TARGET_USER_MATCH:-}" != 'true' ||
                "${SSH_KEY_PRESENT:-}" != 'true' ||
                "${CONFIGURED_SSH_USER:-}" != 'root' ]]; then
            printf '%s\n' 'Target admission failed.' >&2
            exit 1
          fi
          printf '%s\n' 'target=matched' 'ssh_key=present'

      - name: Observe a public host key without authentication or trust changes
        id: public_keyscan
        shell: bash
        run: |
          set -euo pipefail
          scan_file=$(mktemp "${RUNNER_TEMP:?}/w0-public-key.XXXXXX")
          trap 'rm -f -- "$scan_file"' EXIT
          if ! ssh-keyscan -T 8 -t ed25519 -p 24700 103.216.117.194 > "$scan_file" 2>/dev/null; then
            printf '%s\n' 'Public key scan failed.' >&2
            exit 1
          fi
          if ! awk 'NR != 1 || NF != 3 || $1 != "[103.216.117.194]:24700" || $2 != "ssh-ed25519" { exit 1 } END { if (NR != 1) exit 1 }' "$scan_file"; then
            printf '%s\n' 'Public key scan record rejected.' >&2
            exit 1
          fi
          if ! key_info=$(ssh-keygen -l -E sha256 -f "$scan_file" 2>/dev/null); then
            printf '%s\n' 'Public key validation failed.' >&2
            exit 1
          fi
          fingerprint=$(printf '%s\n' "$key_info" | awk 'NR == 1 { print $2 }')
          if [[ ! "$fingerprint" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]; then
            printf '%s\n' 'Public key fingerprint rejected.' >&2
            exit 1
          fi
          printf 'server_fingerprint_unverified=%s\n' "$fingerprint"
          printf '%s\n' 'server_identity=UNVERIFIED' 'ssh_auth_attempted=false' 'remote_commands=0'
          if [[ -n "${GITHUB_OUTPUT:-}" ]]; then
            awk '{ print "public_key=" $2 " " $3 }' "$scan_file" >> "$GITHUB_OUTPUT"
          fi

      - name: Inspect only W0 DEV metadata using the user-accepted host pin
        id: readonly_inspect
        shell: bash
        env:
          PUBLIC_HOST_KEY: ${{ steps.public_keyscan.outputs.public_key }}
          TRUSTED_HOST_FINGERPRINT: SHA256:Aq1xf+wYiyPZ4cgL7r1rdJlJPgmfShY7WGB26gAHXLo
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          fail() { printf '%s\n' "$1" >&2; exit 1; }
          [[ -n "${SSH_PRIVATE_KEY:-}" ]] || fail 'SSH identity missing.'
          private_key=$SSH_PRIVATE_KEY
          unset SSH_PRIVATE_KEY
          [[ "${PUBLIC_HOST_KEY:-}" =~ ^ssh-ed25519\ [A-Za-z0-9+/]+={0,2}$ && ${#PUBLIC_HOST_KEY} -le 1024 ]] || fail 'Public key rejected.'
          [[ "${TRUSTED_HOST_FINGERPRINT:-}" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]] || fail 'Host pin rejected.'
          owned_files=()
          trap 'for owned_file in "${owned_files[@]}"; do rm -f -- "$owned_file"; done' EXIT
          public_file=$(mktemp "${RUNNER_TEMP:?}/w0-public.XXXXXX")
          owned_files+=("$public_file")
          printf '%s\n' "$PUBLIC_HOST_KEY" > "$public_file"
          key_info=$(ssh-keygen -l -E sha256 -f "$public_file" 2>/dev/null) || fail 'Public key rejected.'
          [[ "$key_info" != *$'\n'* && "$key_info" == *' (ED25519)' ]] || fail 'Public key rejected.'
          fingerprint=$(printf '%s\n' "$key_info" | awk '{ print $2 }')
          [[ "$fingerprint" == "$TRUSTED_HOST_FINGERPRINT" ]] || fail 'Host pin mismatch.'
          known_file=$(mktemp "$RUNNER_TEMP/w0-known.XXXXXX")
          owned_files+=("$known_file")
          printf '[103.216.117.194]:24700 %s\n' "$PUBLIC_HOST_KEY" > "$known_file"
          identity_file=$(mktemp "$RUNNER_TEMP/w0-identity.XXXXXX")
          owned_files+=("$identity_file")
          printf '%s\n' "$private_key" > "$identity_file"
          unset private_key
          output_file=$(mktemp "$RUNNER_TEMP/w0-output.XXXXXX")
          owned_files+=("$output_file")
          error_file=$(mktemp "$RUNNER_TEMP/w0-error.XXXXXX")
          owned_files+=("$error_file")
          if ! ssh -F /dev/null -T -p 24700 -i "$identity_file" \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_file" \
            -o GlobalKnownHostsFile=/dev/null -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no \
            -o PreferredAuthentications=publickey -o IdentityAgent=none -o ForwardAgent=no -o ConnectTimeout=10 \
            -o ProxyCommand=none -o ProxyJump=none -o ControlMaster=no -o ControlPath=none \
            -o ClearAllForwardings=yes -o PermitLocalCommand=no -o RequestTTY=no -o ForwardX11=no -o Tunnel=no \
            -o AddKeysToAgent=no -o UpdateHostKeys=no -o VerifyHostKeyDNS=no \
            -o HostKeyAlgorithms=ssh-ed25519 -o ConnectionAttempts=1 \
            -o ServerAliveInterval=5 -o ServerAliveCountMax=1 \
            root@103.216.117.194 bash --noprofile --norc -s \
            > "$output_file" 2> "$error_file" <<'W0_REMOTE_SH'
          set -eu
          export PYTHONDONTWRITEBYTECODE=1
          python3 - <<'W0_REMOTE_PY'
          import http.client
          import json
          import os
          from pathlib import Path
          import re
          import signal
          import subprocess

          TARGET = Path('/opt/thg-newhub')
          VERSION = r'v?[0-9]+\.[0-9]+\.[0-9]+(?:[-+][A-Za-z0-9.-]+)?'

          def command(argv):
              try:
                  result = subprocess.run(argv, capture_output=True, timeout=4, check=False)
                  if result.returncode != 0 or len(result.stdout) > 131072:
                      return None
                  return result.stdout.decode('utf-8')
              except (OSError, subprocess.TimeoutExpired, UnicodeError):
                  return None

          def version(value):
              return isinstance(value, str) and len(value) <= 80 and re.fullmatch(VERSION, value)

          try:
              if os.geteuid() != 0 or not TARGET.is_dir():
                  raise ValueError('precondition')
              metadata = {'schemaVersion': 1, 'euid': 0, 'targetDirectory': str(TARGET),
                          'appDirectoryExists': True}
              release = {}
              for line in Path('/etc/os-release').read_text().splitlines():
                  key, separator, value = line.partition('=')
                  if separator and key in ('ID', 'VERSION_ID'):
                      value = value.strip('"\'')
                      if re.fullmatch(r'[A-Za-z0-9._-]{1,64}', value):
                          release['id' if key == 'ID' else 'versionId'] = value
              metadata['os'] = release
              for line in Path('/proc/meminfo').read_text().splitlines():
                  match = re.fullmatch(r'MemAvailable:\s+([0-9]+) kB', line)
                  if match:
                      metadata['memoryAvailableBytes'] = int(match[1]) * 1024
                      break
              disk = os.statvfs(TARGET)
              metadata['diskAvailableBytes'] = disk.f_bavail * disk.f_frsize
              metadata['paths'] = {
                  'upgradeScript': (TARGET / 'upgrade.sh').is_file(),
                  'backupScript': (TARGET / 'backup.sh').is_file(),
                  'internalCosignPublicKey': (TARGET / 'internal-cosign.pub').is_file(),
                  'packageJson': (TARGET / 'package.json').is_file(),
                  'srcDirectory': (TARGET / 'src').is_dir(),
              }
              public_info = command(['ssh-keygen', '-l', '-E', 'sha256', '-f',
                                     '/etc/ssh/ssh_host_ed25519_key.pub'])
              if public_info:
                  fields = public_info.split()
                  if len(fields) >= 2 and re.fullmatch(r'SHA256:[A-Za-z0-9+/]{43}', fields[1]):
                      metadata['serverPublicFingerprint'] = fields[1]

              containers = []
              metadata['containerInspection'] = 'UNAVAILABLE'
              ids_text = command(['docker', 'ps', '--all', '--filter',
                                  'label=com.docker.compose.project.working_dir=/opt/thg-newhub',
                                  '--format', '{{.ID}}'])
              if ids_text is not None:
                  ids = ids_text.splitlines()
                  if len(ids) > 32 or any(not re.fullmatch(r'[a-f0-9]{12,64}', item) for item in ids):
                      raise ValueError('container list')
                  container_format = (
                      '{"name":{{json .Name}},"image":{{json .Config.Image}},'
                      '"imageId":{{json .Image}},"status":{{json .State.Status}},'
                      '"health":{{if .State.Health}}{{json .State.Health.Status}}{{else}}null{{end}},'
                      '"workingDirectory":{{json (index .Config.Labels "com.docker.compose.project.working_dir")}},'
                      '"service":{{json (index .Config.Labels "com.docker.compose.service")}},'
                      '"version":{{json (index .Config.Labels "org.opencontainers.image.version")}},'
                      '"revision":{{json (index .Config.Labels "org.opencontainers.image.revision")}}}')
                  records = command(['docker', 'inspect', '--type', 'container', '--format',
                                     container_format, *ids]) if ids else ''
                  if records is not None:
                      for line in records.splitlines():
                          item = json.loads(line)
                          if item.pop('workingDirectory', None) != str(TARGET):
                              raise ValueError('container scope')
                          item['name'] = item['name'].lstrip('/')
                          if not version(item.get('version')):
                              item.pop('version', None)
                          if not isinstance(item.get('revision'), str) or not re.fullmatch(r'[a-fA-F0-9]{7,64}', item['revision']):
                              item.pop('revision', None)
                          if item.get('service') is None:
                              item.pop('service', None)
                          containers.append(item)
                      if len(containers) != len(ids):
                          raise ValueError('container count')
                      metadata['containerInspection'] = 'COMPLETE'
              image_ids = sorted({item['imageId'] for item in containers})
              if any(not re.fullmatch(r'sha256:[a-f0-9]{64}', item) for item in image_ids):
                  raise ValueError('image identifier')
              if image_ids:
                  image_format = ('{"imageId":{{json .Id}},'
                                  '"version":{{json (index .Config.Labels "org.opencontainers.image.version")}},'
                                  '"revision":{{json (index .Config.Labels "org.opencontainers.image.revision")}}}')
                  images_text = command(['docker', 'image', 'inspect', '--format', image_format, *image_ids])
                  if images_text is not None:
                      for line in images_text.splitlines():
                          image = json.loads(line)
                          for item in containers:
                              if item['imageId'] == image.get('imageId'):
                                  if version(image.get('version')):
                                      item['version'] = image['version']
                                  if isinstance(image.get('revision'), str) and re.fullmatch(r'[a-fA-F0-9]{7,64}', image['revision']):
                                      item['revision'] = image['revision']
              metadata['containers'] = containers

              health = {'httpStatus': None}
              connection = http.client.HTTPConnection('127.0.0.1', 3001, timeout=4)
              def health_timeout(*_):
                  raise TimeoutError('health timeout')
              signal.signal(signal.SIGALRM, health_timeout)
              signal.alarm(4)
              try:
                  connection.request('GET', '/api/health')
                  response = connection.getresponse()
                  health['httpStatus'] = response.status
                  body = response.read(65537)
                  if len(body) <= 65536:
                      document = json.loads(body)
                      if isinstance(document, dict):
                          if version(document.get('version')):
                              health['version'] = document['version']
                          if document.get('deploymentMode') in ('PRODUCTION', 'NON_PRODUCTION'):
                              health['deploymentMode'] = document['deploymentMode']
              except (OSError, ValueError, http.client.HTTPException):
                  pass
              finally:
                  signal.alarm(0)
                  connection.close()
              metadata['health'] = health
              print('W0_REMOTE_METADATA_JSON=' + json.dumps(metadata, separators=(',', ':')))
          except Exception:
              raise SystemExit('Read-only metadata collection failed.')
          W0_REMOTE_PY
          W0_REMOTE_SH
          then
            fail 'Read-only SSH inspection failed.'
          fi
          if ! python3 - "$output_file" <<'W0_VALIDATE_PY'
          import json
          import os
          from pathlib import Path
          import re
          import sys

          def require(condition):
              if not condition:
                  raise ValueError('metadata rejected')

          def token(value, pattern, maximum=256):
              require(isinstance(value, str) and len(value) <= maximum and re.fullmatch(pattern, value) is not None)
              return value

          def unique(pairs):
              result = {}
              for key, value in pairs:
                  require(key not in result)
                  result[key] = value
              return result

          try:
              with Path(sys.argv[1]).open('rb') as stream:
                  raw = stream.read(262145)
              require(len(raw) <= 262144)
              marker = 'W0_REMOTE_METADATA_JSON='
              records = [line[len(marker):] for line in raw.decode('utf-8').splitlines() if line.startswith(marker)]
              require(len(records) == 1)
              metadata = json.loads(records[0], object_pairs_hook=unique,
                                    parse_constant=lambda _: require(False))
              require(type(metadata) is dict)
              require({'schemaVersion', 'euid', 'targetDirectory', 'appDirectoryExists', 'os',
                       'memoryAvailableBytes', 'diskAvailableBytes', 'serverPublicFingerprint',
                       'paths', 'containerInspection', 'containers', 'health'} <= metadata.keys())
              require(type(metadata.get('schemaVersion')) is int and metadata['schemaVersion'] == 1)
              require(type(metadata.get('euid')) is int and metadata['euid'] == 0)
              require(metadata.get('targetDirectory') == '/opt/thg-newhub')
              require(metadata.get('appDirectoryExists') is True)
              clean = {'schemaVersion': 1, 'euid': 0, 'targetDirectory': '/opt/thg-newhub', 'appDirectoryExists': True}
              if 'os' in metadata:
                  require(type(metadata['os']) is dict)
                  require({'id', 'versionId'} <= metadata['os'].keys())
                  clean['os'] = {key: token(metadata['os'][key], r'[A-Za-z0-9._-]{1,64}', 64)
                                 for key in ('id', 'versionId') if key in metadata['os']}
              for key in ('memoryAvailableBytes', 'diskAvailableBytes'):
                  if key in metadata:
                      value = metadata[key]
                      require(type(value) is int and 0 <= value <= 2**63 - 1)
                      clean[key] = value
              if 'serverPublicFingerprint' in metadata:
                  value = token(metadata['serverPublicFingerprint'], r'SHA256:[A-Za-z0-9+/]{43}', 50)
                  require(value == os.environ['TRUSTED_HOST_FINGERPRINT'])
                  clean['serverPublicFingerprint'] = value
              if 'paths' in metadata:
                  require(type(metadata['paths']) is dict)
                  require({'upgradeScript', 'backupScript', 'internalCosignPublicKey',
                           'packageJson', 'srcDirectory'} <= metadata['paths'].keys())
                  clean['paths'] = {}
                  for key in ('upgradeScript', 'backupScript', 'internalCosignPublicKey', 'packageJson', 'srcDirectory'):
                      if key in metadata['paths']:
                          require(type(metadata['paths'][key]) is bool)
                          clean['paths'][key] = metadata['paths'][key]
              if 'containerInspection' in metadata:
                  require(metadata['containerInspection'] in ('COMPLETE', 'UNAVAILABLE'))
                  clean['containerInspection'] = metadata['containerInspection']
              require(type(metadata.get('containers')) is list and len(metadata['containers']) <= 32)
              clean['containers'] = []
              for item in metadata['containers']:
                  require(type(item) is dict)
                  container = {
                      'name': token(item.get('name'), r'[A-Za-z0-9][A-Za-z0-9_.-]*'),
                      'image': token(item.get('image'), r'[A-Za-z0-9][A-Za-z0-9._/@:+-]*'),
                      'imageId': token(item.get('imageId'), r'sha256:[a-f0-9]{64}'),
                  }
                  require(item.get('status') in ('created', 'restarting', 'running', 'removing', 'paused', 'exited', 'dead'))
                  container['status'] = item['status']
                  if 'health' in item:
                      require(item['health'] in (None, 'starting', 'healthy', 'unhealthy', 'none'))
                      container['health'] = item['health']
                  if 'service' in item:
                      container['service'] = token(item['service'], r'[A-Za-z0-9][A-Za-z0-9_.-]*', 128)
                  if 'version' in item:
                      container['version'] = token(item['version'], r'v?[0-9]+\.[0-9]+\.[0-9]+(?:[-+][A-Za-z0-9.-]+)?', 80)
                  if 'revision' in item:
                      container['revision'] = token(item['revision'], r'[a-fA-F0-9]{7,64}', 64)
                  clean['containers'].append(container)
              require(type(metadata.get('health')) is dict)
              health = metadata['health']
              require('httpStatus' in health)
              status = health.get('httpStatus')
              require(status is None or (type(status) is int and 100 <= status <= 599))
              clean['health'] = {'httpStatus': status}
              if 'version' in health:
                  clean['health']['version'] = token(health['version'], r'v?[0-9]+\.[0-9]+\.[0-9]+(?:[-+][A-Za-z0-9.-]+)?', 80)
              if 'deploymentMode' in health:
                  require(health['deploymentMode'] in ('PRODUCTION', 'NON_PRODUCTION'))
                  clean['health']['deploymentMode'] = health['deploymentMode']
              print('host_identity=PINNED_USER_TOFU')
              print(marker + json.dumps(clean, separators=(',', ':'), sort_keys=True))
          except Exception:
              raise SystemExit('Remote metadata rejected.')
          W0_VALIDATE_PY
          then
            fail 'Read-only metadata validation failed.'
          fi
