                              return
                          seen.add(name)
                          item = project(d,['name','effect','risk','scopeModel','idempotency','fingerprint','label'])
                          for key, keys in [('audience',['HUMAN','AGENT','EXTENSION','SYSTEM']),('permission',['feature','action']),('agentModes',['ceiling','default','trustedContext']),('approval',['human','agent'])]:
                              item[key] = None if d.get(key) is None else project(d.get(key),keys)
                              if key == 'agentModes' and type(d.get(key)) is dict and type(d[key].get('trustedContext')) is bool:
                                  item[key]['trustedContext'] = d[key]['trustedContext']
                              if key == 'approval' and type(d.get(key)) is dict and 'agent' in d[key] and d[key]['agent'] is None:
                                  item[key]['agent'] = None
                          out['capabilityDefs'].append(item)
                      elif len(name) <= 120 and re.fullmatch(r'task\.[A-Za-z0-9.]+@[1-9][0-9]*',name) and re.search('member|part|parent|import|reopen|transition',name,re.I):
                          out['otherNames'].append(name)
                  names = sorted(set(out['otherNames']), key=lambda n:(n.split('@')[0],-int(n.split('@')[1])))
                  out['truncated'] |= len(names) > 30
                  out['otherNames'] = names[:30]
                  if missing_manifest:
                      out['taskSkillIds'] = sorted(related)[:3]
                      out['catalog']['taskSkills'] = list(out['taskSkillIds'])
                  sources = []
                  for id in dict.fromkeys(['extension-foundation'] + out['taskSkillIds']):
                      for leaf in ('manifest.yaml','SKILL.md'):
                          p = 'skills/' + id + '/' + leaf
                          text = document(p,'SKILL')
                          if text is not None:
                              sources.append((p,text))
                  document('skills/gaps.json','GAPS')
                  refs = set()
                  for p, text in sources:
                      for a,b in re.findall(r'\]\(([^\s()]+)\)|^\s*(?:-\s*)?(?:path|file|ref):\s*["\']?([^\s"\'#]+)["\']?\s*$',text,re.M):
