                  if out['manifest']['status'] == 'OK':
                      out['manifest'] = dict(status='PARSE_ERROR')
              finally:
                  if public_bundle_identity(cid) != expected:
                      out['status'] = 'UNAVAILABLE'
                      out['cache'] = dict(status='UNAVAILABLE',images=[])
                      out['manifest'] = dict(status='UNAVAILABLE')
              return out

