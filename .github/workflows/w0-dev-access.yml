              require(type(c['truncated']) is bool and c['schemaFields'] in ('NOT_READ', 'REFERENCES_ONLY') and c['exclusions'] == 'PUBLIC_ONLY_NO_SYMLINKS')
              require(type(value['candidates']) is list and len(value['candidates']) <= 30)
              for item in value['candidates']:
                  require(type(item) is dict and set(item) in ({'location', 'path', 'kind', 'proof'}, {'location', 'path', 'kind', 'proof', 'sdkVersion'}))
                  require(item['location'] in ('HOST', 'CONTAINER_ERP'))
                  path_ok(item['location'], item['path'])
                  expected = {'CATALOG': 'core-capabilities.json', 'BUNDLE_MANIFEST': 'manifest.json', 'SDK_PACKAGE': 'package.json'}
                  require(item['kind'] in expected and item['path'].endswith('/' + expected[item['kind']]))
                  require(item['proof'] in ('NAME_ONLY', 'SCHEMA_MARKER_VALIDATED', 'SDK_NAME_VALIDATED'))
                  require(item['proof'] != 'SCHEMA_MARKER_VALIDATED' or item['kind'] == 'CATALOG')
                  require(item['proof'] != 'SDK_NAME_VALIDATED' or item['kind'] == 'SDK_PACKAGE')
                  require(item['kind'] != 'SDK_PACKAGE' or item['path'].endswith('/ext-sdk/package.json'))
