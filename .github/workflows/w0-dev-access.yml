            const related = new Set();
            for(const cap of c.capabilities) if(cap && /task|work/i.test(cap.id || '') && Array.isArray(cap.skills)) for(const id of cap.skills) if(ids.has(id)) related.add(id);
            const all = [...related].sort();out.taskSkillIds=all.slice(0,3);if(all.length>3)out.truncated=true;
