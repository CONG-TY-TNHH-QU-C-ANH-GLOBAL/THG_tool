name: THGFulfill lead suggestion canary

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Check, enable, or disable suggestions for THGFulfill only
        required: true
        type: choice
        options: [check, enable, disable]
      context_mode:
        description: Keep, enable, or disable the new need-analysis pipeline
        required: true
        default: keep
        type: choice
        options: [keep, enable, disable]
      image_mode:
        description: Keep, enable, or disable original-photo analysis
        required: true
        default: keep
        type: choice
        options: [keep, enable, disable]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update only the THGFulfill allowlist entry
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          CANARY_OPERATION: ${{ inputs.operation }}
          CONTEXT_MODE: ${{ inputs.context_mode }}
          IMAGE_MODE: ${{ inputs.image_mode }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          envs: CANARY_OPERATION,CONTEXT_MODE,IMAGE_MODE
          command_timeout: 3m
          script: |
            set -eu
            case "$CANARY_OPERATION" in check|enable|disable) ;; *) exit 1 ;; esac
            sudo --preserve-env=CONTEXT_MODE,IMAGE_MODE python3 - "$CANARY_OPERATION" <<'PY'
            import os
            import re
            import sqlite3
            import stat
            import subprocess
            import sys
            import tempfile
            import time
            from pathlib import Path

            operation = sys.argv[1]
            modes = {b'LEAD_CONTEXT_ANALYSIS_ENABLED': os.environ.get('CONTEXT_MODE', 'keep'),
                     b'LEAD_IMAGE_CONTEXT_ENABLED': os.environ.get('IMAGE_MODE', 'keep')}
            if any(mode not in ('keep', 'enable', 'disable') for mode in modes.values()):
                sys.exit('analysis_mode=invalid')
            if operation != 'enable' and any(mode != 'keep' for mode in modes.values()):
                sys.exit('analysis_mode=requires_enable_operation')
            config = Path('/etc/thg-scraper/env')
            services = ('thg-scraper', 'thg-worker')
            if operation != 'check' and Path('/opt/thg-scraper/.worker-hold').exists():
                sys.exit('worker=held_no_restart')
            db_uri = 'file:/opt/thg-scraper/data/scraper.db?mode=ro'

            with sqlite3.connect(db_uri, uri=True) as db:
                rows = db.execute(
                    "SELECT id FROM organizations WHERE lower(replace(name, ' ', '')) = 'thgfulfill' LIMIT 2"
                ).fetchall()
            if len(rows) != 1 or not isinstance(rows[0][0], int) or rows[0][0] <= 0:
                sys.exit('target_org=unavailable')
            org_id = str(rows[0][0])

            original = config.read_bytes()
            lines = original.splitlines(keepends=True)

            def assignment(name, required=True):
                matches = [(i, line) for i, line in enumerate(lines)
                           if re.match(rb'^\s*' + name + rb'\s*=', line)]
                if not matches and not required:
                    return None, ''
                if len(matches) != 1:
                    sys.exit('production_config=unexpected_assignments')
                index, line = matches[0]
                value = line.split(b'=', 1)[1].strip().strip(bytes([34, 39])).decode('ascii')
                return index, value

            _, flag = assignment(b'LEAD_SUGGESTION_ENABLED')
            if flag.lower() not in ('1', 'true', 'yes', 'y', 'on'):
                sys.exit('suggestion_flag=off')
            index, raw_allowlist = assignment(b'LEAD_SUGGESTION_ORG_IDS')
            if raw_allowlist == '*':
                sys.exit('allowlist=wildcard_refused')
            if raw_allowlist and not re.fullmatch(r'[1-9][0-9]*(,[1-9][0-9]*)*', raw_allowlist):
                sys.exit('allowlist=invalid_refused')
            if operation == 'check':
                for name in modes:
                    _, value = assignment(name, required=False)
                    print(name.decode('ascii').lower() + '=' + ('on' if value.lower() in ('1', 'true', 'yes', 'y', 'on') else 'off'))
                print('result=ready')
                sys.exit(0)
            ids = raw_allowlist.split(',') if raw_allowlist else []
            if operation == 'enable' and org_id not in ids:
                ids.append(org_id)
            elif operation == 'disable':
                ids = [item for item in ids if item != org_id]
            if 'enable' in modes.values() and ids != [org_id]:
                sys.exit('analysis_scope=requires_only_thgfulfill_allowlisted')
            expected = operation == 'enable'
            suffix = b'\r\n' if lines[index].endswith(b'\r\n') else b'\n'
            lines[index] = b'LEAD_SUGGESTION_ORG_IDS=' + ','.join(ids).encode('ascii') + suffix
            for name, mode in modes.items():
                if mode == 'keep':
                    continue
                flag_index, _ = assignment(name, required=False)
                value = b'true' if mode == 'enable' else b'false'
                if flag_index is None:
                    if lines and not lines[-1].endswith(b'\n'):
                        lines[-1] += b'\n'
                    lines.append(name + b'=' + value + b'\n')
                else:
                    lines[flag_index] = name + b'=' + value + b'\n'
            updated = b''.join(lines)

            def write_config(data):
                metadata = config.stat()
                fd, temp_name = tempfile.mkstemp(prefix='.env.canary.', dir=config.parent)
                try:
                    os.fchmod(fd, stat.S_IMODE(metadata.st_mode))
                    os.fchown(fd, metadata.st_uid, metadata.st_gid)
                    with os.fdopen(fd, 'wb') as output:
                        output.write(data)
                        output.flush()
                        os.fsync(output.fileno())
                    os.replace(temp_name, config)
                finally:
                    if os.path.exists(temp_name):
                        os.unlink(temp_name)

            def verify_services():
                for service in services:
                    # Type=simple may report active before ExecStart has finished.
                    # Retry the process environment, then fail closed if it stays wrong.
                    for attempt in range(10):
                        try:
                            subprocess.run(['systemctl', 'is-active', '--quiet', service], check=True)
                            pid = subprocess.check_output(
                                ['systemctl', 'show', service, '--property=MainPID', '--value'], text=True
                            ).strip()
                            if not pid.isdigit() or int(pid) <= 0:
                                raise RuntimeError('service_pid_unavailable')
                            entries = Path('/proc/' + pid + '/environ').read_bytes().split(b'\0')
                            process_env = dict(entry.split(b'=', 1) for entry in entries if b'=' in entry)
                            active = process_env.get(b'LEAD_SUGGESTION_ENABLED', b'').lower()
                            if active not in (b'1', b'true', b'yes', b'y', b'on'):
                                raise RuntimeError('effective_flag_off_' + service)
                            allowed = process_env.get(b'LEAD_SUGGESTION_ORG_IDS', b'').decode('ascii')
                            if (org_id in allowed.split(',')) != expected:
                                raise RuntimeError('effective_allowlist_mismatch_' + service)
                            for name, mode in modes.items():
                                if mode == 'keep':
                                    continue
                                enabled = process_env.get(name, b'').lower() in (b'1', b'true', b'yes', b'y', b'on')
                                if enabled != (mode == 'enable'):
                                    raise RuntimeError('effective_analysis_mismatch_' + service)
                            if modes[b'LEAD_CONTEXT_ANALYSIS_ENABLED'] == 'enable':
                                override = [process_env.get(name, b'').strip() for name in
                                            (b'LEAD_MODEL_API_KEY', b'LEAD_MODEL_BASE_URL', b'LEAD_MODEL_NAME')]
                                provider_ready = all(override) if any(override) else any(
                                    process_env.get(name, b'').strip() for name in
                                    (b'LLM_COMMENT_API_KEY', b'LLM_API_KEY', b'OPENAI_API_KEY'))
                                if not provider_ready:
                                    raise RuntimeError('effective_model_config_unavailable_' + service)
                            break
                        except (RuntimeError, subprocess.CalledProcessError, OSError) as exc:
                            if attempt == 9:
                                raise exc
                            time.sleep(1)
                for _ in range(12):
                    health = subprocess.run(
                        ['curl', '-fsS', '--max-time', '2', 'http://127.0.0.1:8080/api/stats'],
                        stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                    )
                    if health.returncode == 0:
                        return
                    time.sleep(2)
                raise RuntimeError('scraper_health_failed')

            if updated != original:
                failure_stage = 'write_config'
                try:
                    write_config(updated)
                    for service in services:
                        failure_stage = 'restart_' + service
                        subprocess.run(['systemctl', 'restart', service], check=True, timeout=60)
                    failure_stage = 'verify_services'
                    verify_services()
                except Exception as exc:
                    reason = str(exc) if isinstance(exc, RuntimeError) else type(exc).__name__
                    print('failure_stage=' + failure_stage, file=sys.stderr)
                    print('failure_reason=' + reason, file=sys.stderr)
                    write_config(original)
                    rollback_ok = True
                    for service in services:
                        rollback_ok &= subprocess.run(['systemctl', 'restart', service]).returncode == 0
                    sys.exit('result=rolled_back' if rollback_ok else 'result=rollback_failed')
            else:
                verify_services()
            print('result=enabled' if expected else 'result=disabled')
            print('services=healthy')
            for name, mode in modes.items():
                if mode != 'keep':
                    print(name.decode('ascii').lower() + '=' + ('on' if mode == 'enable' else 'off'))
            PY
